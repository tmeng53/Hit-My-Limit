name: Email alert

# Run by hand from the Actions tab. Leave "send" unticked for a dry run that only prints the count and the email.
on:
  workflow_dispatch:
    inputs:
      entry:
        description: Entry file, e.g. src/content/changes/2026-10-16-google-google-resets-gemini-and-argon-quotas.md
        required: true
      send:
        description: Send it
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/send-alert.mjs "$ENTRY" ${{ inputs.send && '--send' || '' }}
        env:
          ENTRY: ${{ inputs.entry }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
