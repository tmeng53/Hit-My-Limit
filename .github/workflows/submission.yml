name: Draft entry from submission

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  draft:
    if: contains(github.event.issue.labels.*.name, 'submission') && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: entry
        run: node scripts/issue-to-entry.mjs
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          AUTHOR_ASSOCIATION: ${{ github.event.issue.author_association }}
      # Pull requests opened by the bot don't trigger the Build workflow, and free resets merge
      # straight away, so check the site still builds before opening one.
      - id: build
        if: steps.entry.outputs.ok == 'true'
        continue-on-error: true
        run: npm ci && npm run build
      - if: steps.entry.outputs.ok == 'true' && steps.build.outcome == 'success'
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: submission/${{ github.event.issue.number }}
          commit-message: "Add change: ${{ steps.entry.outputs.title }}"
          title: "${{ steps.entry.outputs.labels == 'submission,reset' && 'Free reset' || 'Change' }}: ${{ steps.entry.outputs.title }}"
          body: |
            Drafted from #${{ github.event.issue.number }}. Merging publishes it to the site.

            ${{ steps.entry.outputs.notes }}

            Closes #${{ github.event.issue.number }}
          labels: ${{ steps.entry.outputs.labels }}
      # Free resets from a lab's own site or X account go live without waiting for review.
      - if: steps.entry.outputs.fast == 'true' && steps.pr.outputs.pull-request-number
        run: gh pr merge "$PR" --squash --delete-branch --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
      - if: steps.entry.outputs.ok == 'false'
        uses: actions/github-script@v7
        env:
          PROBLEMS: ${{ steps.entry.outputs.problems }}
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `Some fields need fixing. Edit the issue and it will be checked again.\n\n${process.env.PROBLEMS}`,
            });
      - if: steps.build.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `The entry was drafted but the site failed to build with it, so no pull request was opened. See ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId} for the error.`,
            });
