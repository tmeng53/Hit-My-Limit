name: Draft entry from submission

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  draft:
    if: contains(github.event.issue.labels.*.name, 'submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: entry
        run: node scripts/issue-to-entry.mjs
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
      - if: steps.entry.outputs.ok == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: submission/${{ github.event.issue.number }}
          commit-message: "Add change: ${{ steps.entry.outputs.title }}"
          title: "Change: ${{ steps.entry.outputs.title }}"
          body: |
            Drafted from #${{ github.event.issue.number }}. Merging publishes it to the site.

            ${{ steps.entry.outputs.notes }}

            Closes #${{ github.event.issue.number }}
          labels: submission
      - if: steps.entry.outputs.ok == 'false'
        uses: actions/github-script@v7
        env:
          PROBLEMS: ${{ steps.entry.outputs.problems }}
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `Thanks! A few things need fixing before this can be drafted. Edit the issue and the bot will try again:\n\n${process.env.PROBLEMS}`,
            });
